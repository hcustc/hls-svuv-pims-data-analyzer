[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bl03u-mass-spectrum-tool"
version = "0.1.0"
description = "Data processing toolkit for BL03U synchrotron photoionization mass spectra."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4",
    "fastapi",
    "numpy",
    "openpyxl",
    "pandas",
    "pydantic",
    "PyQt6",
    "pyqtgraph",
    "PyWavelets",
    "PyYAML",
    "requests",
    "scikit-learn",
    "scipy",
    "uvicorn",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pyinstaller",
    "pytest",
]

[project.scripts]
bl03u = "bl03u_masstool.scripts.bl03u_cli:main"
bl03u-gui = "bl03u_masstool.desktop:main"
bl03u-build-species-db = "bl03u_masstool.scripts.build_species_database:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["bl03u_masstool*"]
namespaces = true

[tool.setuptools.package-data]
"bl03u_masstool" = [
    "resources/config/*.yaml",
    "resources/pics/*.csv",
    "resources/pics/*.sql",
]
"bl03u_masstool.frontends.web_app" = ["static/*.html", "static/*.css", "static/*.js"]
"bl03u_masstool.scripts" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "gui: marks tests as GUI tests that require display (skip in CI)",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "output",
    "tests/fixtures",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
