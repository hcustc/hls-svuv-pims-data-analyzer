name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Linux core tests and package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Check installation and Python sources
        run: |
          python -m pip check
          python -m compileall -q src tests main.py
          python -m pip wheel --no-deps --wheel-dir "${{ runner.temp }}/wheelhouse" .
          bl03u --help

      - name: Run unit and integration tests
        run: python -m pytest -m "not gui and not real_data"

  gui:
    name: GUI tests (offscreen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Run GUI tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m pytest -m gui

  platform-tests:
    name: Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Check installation and Python sources
        run: |
          python -m pip check
          python -m compileall -q src tests main.py
          python -c "from PyQt6 import QtCore, QtGui, QtWidgets"

      - name: Run all tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m pytest

  required-tests:
    # Keep the existing required status context so branch rules also enforce
    # macOS and Windows tests without a separate ruleset migration.
    name: Core tests and package smoke
    needs: [core, gui, platform-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test job to succeed
        env:
          CORE_RESULT: ${{ needs.core.result }}
          GUI_RESULT: ${{ needs.gui.result }}
          PLATFORM_RESULT: ${{ needs.platform-tests.result }}
        run: |
          if [[ "$CORE_RESULT" != "success" || "$GUI_RESULT" != "success" || "$PLATFORM_RESULT" != "success" ]]; then
            echo "::error::All Linux, macOS, and Windows test jobs must succeed."
            exit 1
          fi
