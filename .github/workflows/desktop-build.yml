name: Build Desktop App
run-name: Desktop App Build • ${{ github.ref_name }}

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Run tests
        run: python -m pytest

      - name: Compile Python sources
        run: python -m compileall -q src main.py

      - name: Build with PyInstaller
        env:
          PYINSTALLER_CONFIG_DIR: ${{ runner.temp }}/pyinstaller
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: pyinstaller --noconfirm --clean packaging/BL03U_MassSpectrumTool.spec

      - name: Package Windows executable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item "dist/BL03U-MassSpectrumTool.exe" "release/BL03U-MassSpectrumTool-Windows.exe"

      - name: Package macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p release
          hdiutil create \
            -volname "BL03U MassSpectrumTool" \
            -srcfolder "dist/BL03U-MassSpectrumTool.app" \
            -ov \
            -format UDZO \
            "release/BL03U-MassSpectrumTool-macOS.dmg"

      - name: Upload test artifacts
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: BL03U-MassSpectrumTool-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish release assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
